<!doctype html><meta charset=utf-8><title>Workshop light bake</title>
<!-- Dev tool, not part of the site. Run after moving anything in the workshop:
     it fires hundreds of lights over the room and writes the soft result to img/workshop-light-*.webp -->
<canvas id=c width=64 height=64></canvas><pre id=log></pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="/workshop-kit.js"></script><script src="/workshop-car.js"></script><script src="/workshop-props.js"></script><script src="/workshop-room.js"></script>
<script type="module">
import * as THREE from 'three';
import {buildScene,lightScene} from '/workshop.js';
const Q=new URLSearchParams(location.search),quality=+(Q.get('q')||1);
const renderer=new THREE.WebGLRenderer({canvas:c,antialias:false,preserveDrawingBuffer:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.autoClear=false;
const {scene,room}=await buildScene({renderer,bakes:{}});scene.background=null;
const real=lightScene(scene);const SUN=real.sun.position.clone().sub(real.sun.target.position).normalize();
scene.remove(real.sun,real.sky,real.fill,real.sun.target,real.sky.target);
const light=new THREE.DirectionalLight('#fff',1);light.castShadow=true;light.shadow.mapSize.set(2048,2048);
Object.assign(light.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:.5,far:44});light.shadow.camera.updateProjectionMatrix();light.shadow.bias=-.0006;light.shadow.normalBias=.02;light.shadow.radius=2.5;
scene.add(light,light.target);light.target.position.set(0,1.4,0);
const SUR={floor:[2048,1418,[0,1,0]],back:[2048,772,[0,0,1]],left:[1420,772,[1,0,0]],right:[1420,772,[-1,0,0]]};
const names=Object.keys(SUR),rts={},mats={};
const makeMat=()=>{const m=new THREE.ShadowMaterial({side:THREE.DoubleSide,depthTest:false,depthWrite:false,transparent:true,blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,forceSinglePass:true});
 m.onBeforeCompile=s=>{s.vertexShader=s.vertexShader.replace('#include <shadowmap_vertex>','#include <shadowmap_vertex>\ngl_Position=vec4(uv*2.-1.,0.,1.);');
  s.fragmentShader=s.fragmentShader.replace('gl_FragColor = vec4( color, opacity * ( 1.0 - getShadowMask() ) );','gl_FragColor = vec4( color*getShadowMask(), 1.0 );').replace('#include <tonemapping_fragment>','').replace('#include <colorspace_fragment>','')};return m};
// a camera that looks at nothing, so a render only refreshes the shadow map
const camA=new THREE.PerspectiveCamera(10,1,1,2);camA.position.set(0,900,0);camA.lookAt(0,2000,0);camA.layers.enableAll();camA.updateMatrixWorld();const tiny=new THREE.WebGLRenderTarget(4,4);
names.forEach((n,i)=>{const [w,h]=SUR[n];rts[n]=new THREE.WebGLRenderTarget(w,h,{type:THREE.FloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter});
 renderer.setRenderTarget(rts[n]);renderer.setClearColor(0,0);renderer.clear();
 const s=room.surfaces[n];s.userData.real=s.material;mats[n]=makeMat();s.material=mats[n];s.frustumCulled=false;s.layers.set(i+1);light.layers.enable(i+1)});
const bakeCam=new THREE.PerspectiveCamera();
const R=(()=>{let a=0;return()=>{a=(a+.61803398875)%1;return a}})(),halton=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r};
const fire=(dir,col,weight)=>{
 light.position.copy(light.target.position).addScaledVector(dir,24);scene.updateMatrixWorld();light.shadow.updateMatrices(light);
 renderer.shadowMap.needsUpdate=true;renderer.setRenderTarget(tiny);renderer.render(scene,camA);renderer.shadowMap.needsUpdate=false;
 names.forEach((n,i)=>{const N=new THREE.Vector3(...SUR[n][2]),d=Math.max(0,N.dot(dir))*weight;if(d<=0)return;mats[n].color.setRGB(col[0]*d,col[1]*d,col[2]*d);
  bakeCam.layers.set(i+1);renderer.setRenderTarget(rts[n]);renderer.render(scene,bakeCam)});
};
const log=m=>{document.getElementById('log').textContent+=m+'\n'};const pause=()=>new Promise(r=>setTimeout(r,0));
const nSky=Math.round(420*quality),nWin=Math.round(260*quality),nSun=Math.round(64*quality);
const t0=performance.now();
// the open sky over the set: ceiling off
room.ceiling.visible=false;
for(let i=0;i<nSky;i++){const u=halton(i+1,2),v=halton(i+1,3),y=.03+.97*u,r=Math.sqrt(1-y*y),a=v*6.283;fire(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),[.93,.965,1.03],2/nSky*1.0);if(i%6===5)await pause()}
// the bright sky seen through the window: ceiling on
room.ceiling.visible=true;
const W0=new THREE.Vector3(-1,.42,.12).normalize();
for(let i=0;i<nWin;i++){const u=(halton(i+1,2)-.5),v=(halton(i+1,3)-.5);const d=W0.clone().add(new THREE.Vector3(.05*(u+v),v*.72,u*1.15)).normalize();fire(d,[1,.97,.9],1/nWin*1.1);if(i%6===5)await pause()}
// the sun, with a small soft disc
for(let i=0;i<nSun;i++){const u=(halton(i+1,2)-.5),v=(halton(i+1,3)-.5);const d=SUN.clone().add(new THREE.Vector3(u*.02,v*.035,v*.035)).normalize();fire(d,[1.3,1.08,.84],1/nSun*1.25);if(i%6===5)await pause()}
{const b=new Float32Array(4),n='floor',[w,h]=SUR[n];renderer.readRenderTargetPixels(rts[n],w>>1,h>>1,1,1,b);log('centre '+[...b].join(','));renderer.readRenderTargetPixels(rts[n],w>>2,h>>2,1,1,b);log('q '+[...b].join(','))}
log('fired '+(nSky+nWin+nSun)+' lights in '+((performance.now()-t0)/1000).toFixed(1)+'s');
// write out in sRGB, with a little constant bounce lifted in
const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({uniforms:{t:{value:null},lift:{value:new THREE.Color()},scale:{value:.4}},depthTest:false,depthWrite:false,vertexShader:'varying vec2 u;void main(){u=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`varying vec2 u;uniform sampler2D t;uniform vec3 lift;uniform float scale;
vec3 s(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(.41666))-.055,step(.0031308,c));}
void main(){vec3 c=(texture2D(t,u).rgb+lift)*scale;gl_FragColor=vec4(s(clamp(c,0.,1.)),1.);}`}));
quad.frustumCulled=false;const qs=new THREE.Scene();qs.add(quad);const qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
for(const n of names){
 const [w,h]=SUR[n],out=new THREE.WebGLRenderTarget(w,h,{type:THREE.UnsignedByteType});quad.material.uniforms.t.value=rts[n].texture;quad.material.uniforms.lift.value.setRGB(.15,.145,.135);
 renderer.autoClear=true;renderer.setRenderTarget(out);renderer.render(qs,qc);const buf=new Uint8Array(w*h*4);renderer.readRenderTargetPixels(out,0,0,w,h,buf);
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d'),im=x.createImageData(w,h);for(let y=0;y<h;y++)im.data.set(buf.subarray((h-1-y)*w*4,(h-y)*w*4),y*w*4);x.putImageData(im,0,0);
 const body=cv.toDataURL('image/webp',.9);await fetch('/shot?name=workshop-light-'+n,{method:'POST',body});log('saved '+n+' '+Math.round(body.length*.75/1024)+'KB');
}
window.done=true;
</script>
